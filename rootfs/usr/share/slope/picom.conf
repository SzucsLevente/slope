# Slope compositor settings (picom 12)
#
# Soft shadows, rounded corners, frosted glass behind the top bar, menus and
# Spotlight, and macOS-style window animations:
#   open      windows zoom in from 88 % while fading in
#   close     windows shrink a little and fade out
#   hide      (yellow button, or the red button hiding an app's last window)
#             the window shrinks and flies into the Dock
#   show      it grows back out of the Dock

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

shadow = true;
shadow-radius = 24;
shadow-opacity = 0.38;
shadow-offset-x = -22;
shadow-offset-y = -16;

corner-radius = 10;

blur-method = "dual_kawase";
blur-strength = 7;
blur-background = false;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

animations = (
  {
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.88;
    duration = 0.22;
  },
  {
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.92;
    duration = 0.18;
  },
  {
    # "minimize into the Dock": shrink towards the bottom centre of the screen
    triggers = [ "hide" ];
    var-p = {
      curve = "cubic-bezier(0.55, 0.0, 0.7, 0.4)";
      duration = 0.34;
      start = 0;
      end = 1;
    };
    var-tx = "window-monitor-x + window-monitor-width / 2";
    var-ty = "window-monitor-y + window-monitor-height - 36";
    scale-x = "1 - 0.92 * var-p";
    scale-y = "1 - 0.95 * var-p";
    offset-x = "window-width / 2 + (var-tx - window-x - window-width / 2) * var-p - scale-x * window-width / 2";
    offset-y = "window-height / 2 + (var-ty - window-y - window-height / 2) * var-p - scale-y * window-height / 2";
    opacity = {
      curve = "cubic-bezier(0.8, 0.0, 1.0, 1.0)";
      duration = 0.34;
      start = 1;
      end = 0;
    };
    shadow-opacity = "opacity";
    blur-opacity = "opacity";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  },
  {
    # back out of the Dock
    triggers = [ "show" ];
    var-p = {
      curve = "cubic-bezier(0.2, 0.7, 0.3, 1.0)";
      duration = 0.32;
      start = 1;
      end = 0;
    };
    var-tx = "window-monitor-x + window-monitor-width / 2";
    var-ty = "window-monitor-y + window-monitor-height - 36";
    scale-x = "1 - 0.92 * var-p";
    scale-y = "1 - 0.95 * var-p";
    offset-x = "window-width / 2 + (var-tx - window-x - window-width / 2) * var-p - scale-x * window-width / 2";
    offset-y = "window-height / 2 + (var-ty - window-y - window-height / 2) * var-p - scale-y * window-height / 2";
    opacity = {
      curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
      duration = 0.2;
      start = 0;
      end = "window-raw-opacity";
    };
    shadow-opacity = "opacity";
    blur-opacity = "opacity";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);

rules = (
  # the desktop, top bar and Dock draw their own look and never animate
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    corner-radius = 0;
    fade = false;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.01; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.01; }
    );
  },
  # GTK client-side-decorated windows bring their own shadow
  {
    match = "_GTK_FRAME_EXTENTS@";
    shadow = false;
    corner-radius = 0;
  },
  # Slope's own shell windows (popovers etc.) draw their own rounded glass
  {
    match = "class_g = 'Slope'";
    shadow = false;
    corner-radius = 0;
  },
  # menus and tooltips: rounded by the compositor, soft shadow, quick fade
  {
    match = "window_type = 'menu' || window_type = 'dropdown_menu' || window_type = 'popup_menu' || window_type = 'tooltip' || window_type = 'combo'";
    corner-radius = 8;
    shadow = true;
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 1.0; duration = 0.12; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.1; }
    );
  },
  # frosted glass behind the top bar, menus, popovers and Spotlight
  {
    match = "name = 'slope-panel' || name = 'slope-spotlight' || name = 'slope-popover' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    blur-background = true;
  },
  { match = "name = 'slope-spotlight'"; shadow = true; },
  { match = "name = 'slope-popover'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'dnd'"; shadow = false; }
);
