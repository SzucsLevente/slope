# Slope compositor settings (picom)
backend = "glx";
vsync = true;
use-damage = true;

# soft macOS-like shadows
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.38;
shadow-offset-x = -22;
shadow-offset-y = -16;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Slope' && name != 'slope-spotlight'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dnd'"
];

# rounded window corners
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Slope'",
  "_GTK_FRAME_EXTENTS@:c"
];

# frosted glass behind the top bar, menus and Spotlight
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "name = 'slope-dock'",
  "!(name = 'slope-panel' || name = 'slope-spotlight' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu')"
];

# gentle fades when windows open, close, hide and minimize
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.08;
fade-delta = 8;
fade-exclude = [ "window_type = 'desktop'" ];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
};
