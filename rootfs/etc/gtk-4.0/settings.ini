[Settings]
gtk-theme-name=Slope
gtk-icon-theme-name=Slope
gtk-cursor-theme-name=Adwaita
gtk-font-name=Inter 10
# every window gets the Slope frame (traffic lights) from the window manager,
# so apps that draw their own title bar must not add a second set of buttons
# (or a second window menu whose Close would quit the app)
gtk-decoration-layout=:
gtk-titlebar-right-click=none
gtk-dialogs-use-header=0
gtk-hint-font-metrics=1
