# Slope networking
#  - NetworkManager handles wired (Ethernet), mobile broadband and VPNs
#  - Wi-Fi belongs to iwd (see /etc/iwd/main.conf and the Wi-Fi app)
#  - DNS goes through systemd-resolved
[main]
dns=systemd-resolved

[keyfile]
unmanaged-devices=type:wifi

[ifupdown]
managed=true

# NetworkManager switches to an "iwd" Wi-Fi backend on its own when it sees
# iwd, and then registers as iwd's IP-configuration agent while refusing to
# configure the (unmanaged) Wi-Fi card, so Wi-Fi never gets an IP address.
# Pinning the old backend keeps NetworkManager away from iwd entirely.
[device]
wifi.backend=wpa_supplicant
