# iwd (iNet wireless daemon) settings for Slope.
# iwd manages Wi-Fi on its own, including DHCP, so no other tool is needed.
[General]
EnableNetworkConfiguration=true
# keep the real MAC address: some routers and captive portals dislike random ones
AddressRandomization=disabled

[Network]
NameResolvingService=systemd
EnableIPv6=true

[Scan]
DisablePeriodicScan=false
