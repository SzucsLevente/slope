[LightDM]
# Do not wait for logind to report a "graphical" seat: with some virtual GPUs
# (VirtualBox VMSVGA) the seat stops being graphical when the real driver
# replaces the boot framebuffer, and LightDM then gave up, leaving a black
# screen.  slope-wait-gpu (lightdm.service.d/slope.conf) waits for the driver.
logind-check-graphical=false

[Seat:*]
user-session=slope
autologin-session=slope
greeter-session=lightdm-gtk-greeter
