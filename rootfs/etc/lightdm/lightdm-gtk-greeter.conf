[greeter]
background=/usr/share/backgrounds/slope/aqua.png
theme-name=Slope
icon-theme-name=Slope
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%a %d %b  %H:%M
default-user-image=/usr/share/backgrounds/slope/logo-128.png
position=50%,center 50%,center
